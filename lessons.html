<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 小课堂 · 鋆曦的学习手账</title>
<style>
  :root{
    --paper:#f0f2f5;
    --paper-2:#e5e9ed;
    --ink:#3d4a57;
    --ink-soft:#66758a;
    --ink-faint:#93a2b3;
    --rose:#8ba3bd;
    --rose-deep:#6e86a3;
    --coral:#9fb0c4;
    --caramel:#8fa5ba;
    --sage:#a3b5a5;
    --yellow:#d8c9a7;
    --line:#d7dee6;
    --card:#fcfdfe;
    --shadow:0 2px 10px rgba(96,116,138,.10), 0 10px 30px rgba(96,116,138,.08);
    --shadow-lift:0 6px 18px rgba(96,116,138,.16), 0 18px 44px rgba(96,116,138,.12);
    --serif:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi","楷体",serif;
    --sans:"LXGW WenKai","Kaiti SC","STKaiti","KaiTi","楷体","PingFang SC","Microsoft YaHei",sans-serif;
    --num:Georgia,"Times New Roman",var(--serif);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--sans);color:var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(139,163,189,.10), transparent 34%),
      radial-gradient(circle at 88% 24%, rgba(163,181,165,.10), transparent 36%),
      radial-gradient(circle at 70% 85%, rgba(216,201,167,.08), transparent 30%),
      var(--paper);
    line-height:1.8;min-height:100vh;
  }
  ::selection{background:rgba(139,163,189,.30)}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

  /* ---------- 顶部导航 ---------- */
  .top-nav{position:sticky;top:0;z-index:50;background:rgba(240,242,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px}
  .nav-links{max-width:900px;margin:0 auto;display:flex;gap:10px;justify-content:center}
  .nav-pill{font-size:14px;letter-spacing:.08em;padding:7px 18px;border-radius:999px;color:var(--ink-soft);text-decoration:none;border:1.5px solid transparent;transition:all .18s ease;min-height:40px;display:inline-flex;align-items:center;font-family:var(--sans)}
  .nav-pill:hover{color:var(--rose-deep);background:var(--card)}
  .nav-pill.active{background:var(--card);border-color:var(--rose);color:var(--rose-deep);box-shadow:var(--shadow)}

  /* ---------- Hero ---------- */
  header{padding:64px 0 26px;text-align:center}
  .l-hero-sub{font-size:14px;color:var(--ink-soft);letter-spacing:.24em;margin-bottom:12px}
  h1{font-family:var(--serif);font-size:clamp(38px,6vw,58px);letter-spacing:.1em;color:var(--ink);line-height:1.3}
  .l-hero-tip{margin-top:12px;font-size:14px;color:var(--ink-faint);letter-spacing:.12em}

  /* ---------- 课程 ---------- */
  section{padding-top:34px}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:26px}
  .sec-head h2{font-family:var(--serif);font-size:clamp(24px,3.6vw,30px);letter-spacing:.12em;font-weight:700}
  .sec-head .rule{flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px)}
  .lesson-tip{font-size:13.5px;color:var(--ink-faint);letter-spacing:.08em;margin:-14px 0 18px}
  .lesson-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
  .lesson-tab{
    width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink-soft);cursor:pointer;
    font-family:var(--num);font-size:15px;font-style:italic;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all .18s ease;padding:0;line-height:1;
  }
  .lesson-tab:hover{border-color:var(--rose);color:var(--rose-deep);transform:translateY(-1px)}
  .lesson-tab.active{background:var(--rose-deep);border-color:var(--rose-deep);color:#fff;box-shadow:0 4px 12px rgba(110,134,163,.35)}
  .lesson-tab .tab-new{font-size:8.5px;font-style:normal;position:relative;top:-9px;right:2px}
  .lessons{display:flex;flex-direction:column;gap:18px}
  .lesson-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;box-shadow:var(--shadow);position:relative;
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .lesson-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
  .lesson-card .l-head{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
  .lesson-card .l-no{font-family:var(--num);font-style:italic;color:var(--rose-deep);font-size:15px;letter-spacing:.08em;flex:none}
  .lesson-card .l-title{font-family:var(--serif);font-size:20px;letter-spacing:.05em;font-weight:700;color:var(--ink)}
  .lesson-card .l-date{margin-left:auto;font-family:var(--num);font-size:12.5px;color:var(--ink-faint);font-style:italic;letter-spacing:.1em;flex:none}
  .lesson-card .l-body{font-size:14.5px;line-height:1.85;color:var(--ink-soft);word-break:break-word}
  .lesson-card .l-body p{margin:0 0 10px}
  .lesson-card .l-body p:last-child{margin-bottom:0}
  .lesson-card .l-body strong{color:var(--ink);font-weight:700}
  .lesson-card .l-body em{color:var(--rose-deep)}
  .lesson-card .l-body hr{border:none;border-top:1px dashed var(--line);margin:14px 0}
  .lesson-card .l-body .l-scene{background:var(--paper-2);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;color:var(--ink)}
  .lesson-card .l-note{
    font-size:14px;color:var(--rose-deep);background:rgba(139,163,189,.08);
    border-left:3px solid var(--rose);border-radius:0 8px 8px 0;padding:8px 12px;margin-top:6px;
  }
  .empty{text-align:center;color:var(--ink-faint);font-size:15px;padding:26px 0;letter-spacing:.08em}

  footer{margin-top:80px;text-align:center;color:var(--ink-faint);font-size:13px;letter-spacing:.14em}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-links">
    <a class="nav-pill" href="index.html">❦ 恋爱手账</a>
    <a class="nav-pill active" href="lessons.html">✨ AI 小课堂</a>
  </div>
</nav>

<div class="wrap">
  <header>
    <div class="l-hero-sub">— 鋆曦的 AI 学习手账 · 每天学一点 —</div>
    <h1>AI 小课堂</h1>
    <div class="l-hero-tip">大模型 / Agent / 提示词，用大白话讲给你听</div>
  </header>

  <section id="lessons">
    <div class="sec-head"><h2>每日一课</h2><span class="rule"></span></div>
    <div class="lesson-tip">鋆曦的 AI 学习手账，每天学一点 ✨</div>
    <div class="lesson-tabs" id="lessonTabs"></div>
    <div class="lessons" id="lessonsBox">
      <div class="empty">加载课程中…</div>
    </div>
  </section>

  <footer>❦ 鋆曦的 AI 学习手账 · 与夫垚的恋爱手账一起成长</footer>
</div>

<script>
(function(){
  "use strict";
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  var $ = function(id){ return document.getElementById(id); };

  /* 课程正文为轻量 markdown：支持 **加粗**、段落（空行分隔） */
  function lessonHtml(md){
    if (!md) return "";
    // 去掉开头「📚 每日一课 · 第 N 课｜…」标题行（卡片头部已显示标题）
    var lines = md.split("\n");
    while (lines.length && /^📚/.test(lines[0])) lines.shift();
    var h = esc(lines.join("\n"));
    h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    var paras = h.split(/\n{2,}/).map(function(p){ return p.replace(/\n/g, "<br>"); });
    return paras.map(function(p){
      p = p.trim();
      if (!p) return "";
      if (/^[-—]{3,}$/.test(p)) return "<hr>";
      return "<p>" + p + "</p>";
    }).join("");
  }

  function renderLessons(){
    var box = $("lessonsBox");
    var tabs = $("lessonTabs");
    fetch("love-data/lessons.json?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function(data){
        var list = (data && data.lessons) || [];
        if (!list.length){
          box.innerHTML = '<div class="empty">课程还没开始，等鋆曦开讲 ✨</div>';
          tabs.innerHTML = "";
          return;
        }
        var sorted = list.slice().sort(function(a, b){ return (a.no || 0) - (b.no || 0); });
        var latest = sorted[sorted.length - 1].no;
        var html = sorted.map(function(l){
          var title = l.title || ("第 " + l.no + " 课");
          var dateStr = (l.date || "").replace(/-/g, ".");
          return '<div class="lesson-card" data-no="' + esc(String(l.no)) + '"' +
            (l.no === latest ? "" : ' style="display:none"') + '>' +
            '<div class="l-head">' +
              '<span class="l-no">第 ' + esc(String(l.no)) + ' 课</span>' +
              '<span class="l-title">' + esc(title) + '</span>' +
              '<span class="l-date">' + esc(dateStr) + '</span>' +
            '</div>' +
            '<div class="l-body">' + lessonHtml(l.md) + '</div>' +
          '</div>';
        }).join("");
        box.innerHTML = html;
        tabs.innerHTML = sorted.map(function(l){
          var isNew = l.no === latest;
          return '<button class="lesson-tab' + (isNew ? " active" : "") + '" data-no="' + esc(String(l.no)) + '"' +
            ' title="第 ' + esc(String(l.no)) + ' 课' + (isNew ? "（最新）" : "") + '">' +
            esc(String(l.no)) + (isNew ? '<span class="tab-new">✿</span>' : "") + '</button>';
        }).join("");
        var buttons = tabs.querySelectorAll(".lesson-tab");
        Array.prototype.forEach.call(buttons, function(btn){
          btn.addEventListener("click", function(){
            var no = btn.getAttribute("data-no");
            Array.prototype.forEach.call(buttons, function(b){ b.classList.remove("active"); });
            btn.classList.add("active");
            var cards = box.querySelectorAll(".lesson-card");
            Array.prototype.forEach.call(cards, function(c){
              c.style.display = (c.getAttribute("data-no") === no) ? "" : "none";
            });
          });
        });
      })
      .catch(function(){
        box.innerHTML = '<div class="empty">课程加载失败（需联网）</div>';
        tabs.innerHTML = "";
      });
  }

  renderLessons();
})();
</script>
</body>
</html>
